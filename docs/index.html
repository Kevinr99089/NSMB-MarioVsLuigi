    <style>html, body { overscroll-behavior: none; touch-action: manipulation; margin: 0 !important; padding: 0 !important; overflow: hidden !important; background: #1e1e28 !important; }
    #unity-canvas { position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; }</style>
    <script>
      function requestFullscreenSafe() {
        if (document.fullscreenElement) return;
        var el = document.documentElement;
        var request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (request) {
          try {
            var result = request.call(el);
            if (result && result.catch) { result.catch(function() {}); }
          } catch (e) {}
        }
      }
      window.addEventListener('load', requestFullscreenSafe);
      document.addEventListener('click', requestFullscreenSafe);
      document.addEventListener('touchend', requestFullscreenSafe);
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
      }
      function isBenignFullscreenPermissionError(err) {
        return err instanceof TypeError && err.message === 'Permissions check failed';
      }
      window.addEventListener('error', function(event) {
        if (isBenignFullscreenPermissionError(event.error)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (isBenignFullscreenPermissionError(event.reason)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      function hookUnityQuit(unityInstance) {
        var module = unityInstance && unityInstance.Module;
        if (!module) return;
        module.onQuit = function() {
          var isStandalone = window.navigator.standalone === true ||
            location.search.indexOf('homescreen=1') !== -1;
          if (document.fullscreenElement) {
            (document.exitFullscreen || function() {}).call(document).catch(function() {});
          }
          try { window.close(); } catch (e) {}
          if (isStandalone) {
            setTimeout(function() {
              try {
                location.href = 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end';
              } catch (e) {}
            }, 150);
          }
          setTimeout(function() {
            document.body.innerHTML =
              '<div style="position:fixed;inset:0;display:flex;align-items:center;' +
              'justify-content:center;background:#1e1e28;color:#fff;' +
              'font-family:sans-serif;font-size:1.1rem;text-align:center;' +
              'padding:2rem;">Jeu quitte. Vous pouvez maintenant fermer cette fenetre.<br>' +
              'Game closed. You can now close this window.</div>';
          }, 500);
        };
      }
    </script>
    <script>
      function fitUnityCanvasNoCrop() {
        var canvas = document.getElementById('unity-canvas');
        if (!canvas) return;
        var targetRatio = 16 / 9;
        var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
        var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        var w, h;
        if (vw / vh > targetRatio) {
          h = vh;
          w = h * targetRatio;
        } else {
          w = vw;
          h = w / targetRatio;
        }
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
      }
      window.addEventListener('load', fitUnityCanvasNoCrop);
      window.addEventListener('resize', fitUnityCanvasNoCrop);
      window.addEventListener('orientationchange', fitUnityCanvasNoCrop);
      document.addEventListener('fullscreenchange', fitUnityCanvasNoCrop);
      document.addEventListener('webkitfullscreenchange', fitUnityCanvasNoCrop);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitUnityCanvasNoCrop);
      }
      fitUnityCanvasNoCrop();
    </script>
    <style>
      #vgp-root { position: fixed; inset: 0; z-index: 999999; pointer-events: none; opacity: 1; transition: opacity 0.25s ease; touch-action: none; }
      #vgp-root, #vgp-root * { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; -webkit-tap-highlight-color: transparent !important; }
      #vgp-root.vgp-hidden { opacity: 0; }
      #vgp-root.vgp-hidden .vgp-dpad, #vgp-root.vgp-hidden .vgp-actions, #vgp-root.vgp-hidden .vgp-l, #vgp-root.vgp-hidden .vgp-r, #vgp-root.vgp-hidden .vgp-start { pointer-events: none; }
      .vgp-visual { position: absolute; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.9); font-family: sans-serif; font-weight: bold; border-radius: 50%; pointer-events: none; }
      .vgp-visual.vgp-active { background: rgba(255,255,255,0.42); }
      .vgp-dpad { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: clamp(160px, 36vmin, 220px); height: clamp(160px, 36vmin, 220px); border-radius: 50%; background: rgba(255,255,255,0.06); pointer-events: auto; touch-action: none; }
      .vgp-dpad .vgp-visual { width: 30%; height: 30%; border-radius: 8px; font-size: clamp(14px, 3.4vmin, 20px); }
      .vgp-up { top: 4%; left: 35%; }
      .vgp-down { bottom: 4%; left: 35%; }
      .vgp-left { left: 4%; top: 35%; }
      .vgp-right { right: 4%; top: 35%; }
      .vgp-knob { position: absolute; left: 50%; top: 50%; width: 24%; height: 24%; margin-left: -12%; margin-top: -12%; border-radius: 50%; background: rgba(255,255,255,0.32); border: 2px solid rgba(255,255,255,0.55); pointer-events: none; transition: transform 0.05s linear; }
      .vgp-actions { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: clamp(180px, 40vmin, 240px); height: clamp(180px, 40vmin, 240px); pointer-events: auto; touch-action: none; }
      .vgp-actions .vgp-visual { width: 50%; height: 50%; font-size: clamp(18px, 4.4vmin, 24px); }
      .vgp-a { right: 0; top: 2%; }
      .vgp-b { left: 0; bottom: 2%; }
      .vgp-l, .vgp-r { position: absolute; top: max(14px, env(safe-area-inset-top)); width: clamp(64px, 15vmin, 92px); height: clamp(46px, 10vmin, 64px); border-radius: 12px; font-size: clamp(14px, 3.4vmin, 18px); pointer-events: auto; touch-action: none; }
      .vgp-l { left: max(48px, calc(env(safe-area-inset-left) + 32px)); }
      .vgp-r { right: max(48px, calc(env(safe-area-inset-right) + 32px)); }
      .vgp-start { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); width: clamp(84px, 18vmin, 110px); height: clamp(38px, 8vmin, 48px); border-radius: 16px; font-size: clamp(11px, 2.6vmin, 14px); pointer-events: auto; touch-action: none; }
    </style>
    <script>
      function vgpInit() {
        var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (!isTouch) return;

        var root = document.createElement('div');
        root.id = 'vgp-root';
        root.innerHTML =
          '<div class="vgp-dpad">' +
          '<div class="vgp-visual vgp-up">&#9650;</div>' +
          '<div class="vgp-visual vgp-down">&#9660;</div>' +
          '<div class="vgp-visual vgp-left">&#9664;</div>' +
          '<div class="vgp-visual vgp-right">&#9654;</div>' +
          '<div class="vgp-knob"></div>' +
          '</div>' +
          '<div class="vgp-actions">' +
          '<div class="vgp-visual vgp-a">A</div>' +
          '<div class="vgp-visual vgp-b">B</div>' +
          '</div>' +
          '<div class="vgp-visual vgp-l">L</div>' +
          '<div class="vgp-visual vgp-r">R</div>' +
          '<div class="vgp-visual vgp-start">Start</div>';
        document.body.appendChild(root);
        root.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        root.addEventListener('selectstart', function (e) { e.preventDefault(); });

        var canvas = document.getElementById('unity-canvas');

        function vgpSendKey(type, code, key, keyCode) {
          var targets = canvas ? [document, window, canvas] : [document, window];
          for (var i = 0; i < targets.length; i++) {
            targets[i].dispatchEvent(new KeyboardEvent(type, {
              code: code, key: key, keyCode: keyCode, which: keyCode,
              bubbles: true, cancelable: true
            }));
          }
        }

        var vgpActiveCount = 0;
        function vgpMarkBusy() { vgpActiveCount++; }
        function vgpMarkFree() { vgpActiveCount = Math.max(0, vgpActiveCount - 1); }

        var vgpHideTimer = null;
        function vgpTryHide() {
          if (vgpActiveCount > 0) {
            vgpHideTimer = setTimeout(vgpTryHide, 1000);
            return;
          }
          root.classList.add('vgp-hidden');
        }
        function vgpShow() {
          root.classList.remove('vgp-hidden');
          if (vgpHideTimer) clearTimeout(vgpHideTimer);
          vgpHideTimer = setTimeout(vgpTryHide, 5000);
        }
        document.addEventListener('touchstart', vgpShow, { passive: true });
        vgpShow();

        function vgpFindTouch(e, id) {
          for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === id) return e.changedTouches[i];
          }
          return null;
        }

        var vgpControls = [];
        function vgpRegisterControl(forceRelease) { vgpControls.push(forceRelease); }
        function vgpForceReleaseAll() {
          for (var i = 0; i < vgpControls.length; i++) vgpControls[i]();
        }
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) vgpForceReleaseAll();
        });
        window.addEventListener('blur', vgpForceReleaseAll);
        window.addEventListener('pagehide', vgpForceReleaseAll);

        function setupSoloButton(el, code, key, keyCode) {
          var touchId = null;
          function release() {
            if (touchId === null) return;
            touchId = null;
            el.classList.remove('vgp-active');
            vgpMarkFree();
            vgpSendKey('keyup', code, key, keyCode);
          }
          el.addEventListener('touchstart', function (e) {
            e.preventDefault();
            if (touchId !== null) return;
            touchId = e.changedTouches[0].identifier;
            el.classList.add('vgp-active');
            vgpMarkBusy();
            vgpSendKey('keydown', code, key, keyCode);
          });
          function onEnd(e) {
            if (touchId === null || !vgpFindTouch(e, touchId)) return;
            release();
          }
          el.addEventListener('touchend', onEnd);
          el.addEventListener('touchcancel', onEnd);
          vgpRegisterControl(release);
        }

        setupSoloButton(root.querySelector('.vgp-l'), 'KeyQ', 'q', 81);
        setupSoloButton(root.querySelector('.vgp-r'), 'KeyE', 'e', 69);
        setupSoloButton(root.querySelector('.vgp-start'), 'Escape', 'Escape', 27);

        function setupSlideGroup(container, entries) {
          var touchId = null;
          var pressed = null;
          function findTarget(x, y) {
            for (var i = 0; i < entries.length; i++) {
              var r = entries[i].el.getBoundingClientRect();
              if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return entries[i];
            }
            return null;
          }
          function press(entry) {
            if (pressed === entry) return;
            if (pressed) {
              pressed.el.classList.remove('vgp-active');
              vgpSendKey('keyup', pressed.code, pressed.key, pressed.keyCode);
            }
            pressed = entry;
            if (pressed) {
              pressed.el.classList.add('vgp-active');
              vgpSendKey('keydown', pressed.code, pressed.key, pressed.keyCode);
            }
          }
          function release() {
            if (touchId === null) return;
            touchId = null;
            press(null);
            vgpMarkFree();
          }
          container.addEventListener('touchstart', function (e) {
            e.preventDefault();
            if (touchId !== null) return;
            var t = e.changedTouches[0];
            touchId = t.identifier;
            vgpMarkBusy();
            press(findTarget(t.clientX, t.clientY));
          });
          container.addEventListener('touchmove', function (e) {
            var t = vgpFindTouch(e, touchId);
            if (!t) return;
            e.preventDefault();
            press(findTarget(t.clientX, t.clientY));
          });
          function onEnd(e) {
            if (touchId === null || !vgpFindTouch(e, touchId)) return;
            release();
          }
          container.addEventListener('touchend', onEnd);
          container.addEventListener('touchcancel', onEnd);
          vgpRegisterControl(release);
        }

        setupSlideGroup(root.querySelector('.vgp-actions'), [
          { el: root.querySelector('.vgp-a'), code: 'Space', key: ' ', keyCode: 32 },
          { el: root.querySelector('.vgp-b'), code: 'ShiftLeft', key: 'Shift', keyCode: 16 }
        ]);

        function setupStick(container, knob) {
          var touchId = null;
          var pressedKeys = { up: false, down: false, left: false, right: false };
          var keyDefs = {
            up: ['ArrowUp', 'ArrowUp', 38],
            down: ['ArrowDown', 'ArrowDown', 40],
            left: ['ArrowLeft', 'ArrowLeft', 37],
            right: ['ArrowRight', 'ArrowRight', 39]
          };
          var octants = [
            ['right'], ['up', 'right'], ['up'], ['up', 'left'],
            ['left'], ['down', 'left'], ['down'], ['down', 'right']
          ];
          function setKey(name, active) {
            if (pressedKeys[name] === active) return;
            pressedKeys[name] = active;
            var def = keyDefs[name];
            vgpSendKey(active ? 'keydown' : 'keyup', def[0], def[1], def[2]);
            var visual = container.querySelector('.vgp-' + name);
            if (visual) visual.classList.toggle('vgp-active', active);
          }
          function releaseAll() {
            setKey('up', false);
            setKey('down', false);
            setKey('left', false);
            setKey('right', false);
            knob.style.transform = 'translate(0px, 0px)';
          }
          function update(x, y) {
            var rect = container.getBoundingClientRect();
            var dx = x - (rect.left + rect.width / 2);
            var dy = y - (rect.top + rect.height / 2);
            var dist = Math.sqrt(dx * dx + dy * dy);
            var radius = rect.width / 2;
            var deadzone = radius * 0.18;
            var maxKnob = radius * 0.62;
            var kx = dx, ky = dy;
            if (dist > maxKnob) {
              kx = (dx / dist) * maxKnob;
              ky = (dy / dist) * maxKnob;
            }
            knob.style.transform = 'translate(' + kx + 'px, ' + ky + 'px)';
            if (dist < deadzone) {
              setKey('up', false); setKey('down', false); setKey('left', false); setKey('right', false);
              return;
            }
            var angle = Math.atan2(-dy, dx) * 180 / Math.PI;
            var idx = Math.round(angle / 45);
            idx = ((idx % 8) + 8) % 8;
            var active = octants[idx];
            setKey('up', active.indexOf('up') !== -1);
            setKey('down', active.indexOf('down') !== -1);
            setKey('left', active.indexOf('left') !== -1);
            setKey('right', active.indexOf('right') !== -1);
          }
          function release() {
            if (touchId === null) return;
            touchId = null;
            releaseAll();
            vgpMarkFree();
          }
          container.addEventListener('touchstart', function (e) {
            e.preventDefault();
            if (touchId !== null) return;
            var t = e.changedTouches[0];
            touchId = t.identifier;
            vgpMarkBusy();
            update(t.clientX, t.clientY);
          });
          container.addEventListener('touchmove', function (e) {
            var t = vgpFindTouch(e, touchId);
            if (!t) return;
            e.preventDefault();
            update(t.clientX, t.clientY);
          });
          function onEnd(e) {
            if (touchId === null || !vgpFindTouch(e, touchId)) return;
            release();
          }
          container.addEventListener('touchend', onEnd);
          container.addEventListener('touchcancel', onEnd);
          vgpRegisterControl(release);
        }

        setupStick(root.querySelector('.vgp-dpad'), root.querySelector('.vgp-knob'));
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', vgpInit);
      } else {
        vgpInit();
      }
    </script>
