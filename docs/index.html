<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e1e28">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>html, body { overscroll-behavior: none; touch-action: manipulation; }</style>
    <script>
      function requestFullscreenSafe() {
        if (document.fullscreenElement) return;
        var el = document.documentElement;
        var request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (request) {
          try {
            var result = request.call(el);
            if (result && result.catch) { result.catch(function() {}); }
          } catch (e) {}
        }
      }
      window.addEventListener('load', requestFullscreenSafe);
      document.addEventListener('click', requestFullscreenSafe);
      document.addEventListener('touchend', requestFullscreenSafe);
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
      }
      function isBenignFullscreenPermissionError(err) {
        return err instanceof TypeError && err.message === 'Permissions check failed';
      }
      window.addEventListener('error', function(event) {
        if (isBenignFullscreenPermissionError(event.error)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (isBenignFullscreenPermissionError(event.reason)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      function hookUnityQuit(unityInstance) {
        var module = unityInstance && unityInstance.Module;
        if (!module) return;
        module.onQuit = function() {
          var isStandalone = window.navigator.standalone === true ||
            location.search.indexOf('homescreen=1') !== -1;
          if (document.fullscreenElement) {
            (document.exitFullscreen || function() {}).call(document).catch(function() {});
          }
          try { window.close(); } catch (e) {}
          if (isStandalone) {
            setTimeout(function() {
              try {
                location.href = 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end';
              } catch (e) {}
            }, 150);
          }
          setTimeout(function() {
            document.body.innerHTML =
              '<div style="position:fixed;inset:0;display:flex;align-items:center;' +
              'justify-content:center;background:#1e1e28;color:#fff;' +
              'font-family:sans-serif;font-size:1.1rem;text-align:center;' +
              'padding:2rem;">Jeu quitte. Vous pouvez maintenant fermer cette fenetre.<br>' +
              'Game closed. You can now close this window.</div>';
          }, 500);
        };
      }
    </script>
    <style>
      #vgp-root { position: fixed; inset: 0; z-index: 999999; pointer-events: none; opacity: 1; transition: opacity 0.25s ease; touch-action: none; }
      #vgp-root.vgp-hidden { opacity: 0; }
      #vgp-root.vgp-hidden .vgp-btn { pointer-events: none; }
      .vgp-btn { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.9); font-family: sans-serif; font-weight: bold; border-radius: 50%; }
      .vgp-btn.vgp-active { background: rgba(255,255,255,0.4); }
      .vgp-dpad { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: clamp(140px, 32vmin, 200px); height: clamp(140px, 32vmin, 200px); }
      .vgp-dpad .vgp-btn { width: 34%; height: 34%; border-radius: 10px; font-size: clamp(14px, 3.4vmin, 20px); }
      .vgp-dpad .vgp-up { top: 0; left: 33%; }
      .vgp-dpad .vgp-down { bottom: 0; left: 33%; }
      .vgp-dpad .vgp-left { left: 0; top: 33%; }
      .vgp-dpad .vgp-right { right: 0; top: 33%; }
      .vgp-actions { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: clamp(140px, 32vmin, 200px); height: clamp(140px, 32vmin, 200px); }
      .vgp-actions .vgp-btn { width: 42%; height: 42%; font-size: clamp(16px, 4vmin, 22px); }
      .vgp-actions .vgp-a { right: 0; top: 8%; }
      .vgp-actions .vgp-b { left: 0; bottom: 8%; }
      .vgp-l, .vgp-r { position: absolute; top: max(14px, env(safe-area-inset-top)); width: clamp(56px, 13vmin, 80px); height: clamp(40px, 9vmin, 56px); border-radius: 12px; font-size: clamp(14px, 3.4vmin, 18px); }
      .vgp-l { left: max(14px, env(safe-area-inset-left)); }
      .vgp-r { right: max(14px, env(safe-area-inset-right)); }
      .vgp-start { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); width: clamp(70px, 16vmin, 96px); height: clamp(32px, 7vmin, 42px); border-radius: 16px; font-size: clamp(11px, 2.6vmin, 14px); }
    </style>
    <script>
      function vgpInit() {
        var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (!isTouch) return;
        var root = document.createElement('div');
        root.id = 'vgp-root';
        root.innerHTML =
          '<div class="vgp-dpad">' +
          '<div class="vgp-btn vgp-up" data-code="ArrowUp" data-key="ArrowUp" data-keycode="38">&#9650;</div>' +
          '<div class="vgp-btn vgp-down" data-code="ArrowDown" data-key="ArrowDown" data-keycode="40">&#9660;</div>' +
          '<div class="vgp-btn vgp-left" data-code="ArrowLeft" data-key="ArrowLeft" data-keycode="37">&#9664;</div>' +
          '<div class="vgp-btn vgp-right" data-code="ArrowRight" data-key="ArrowRight" data-keycode="39">&#9654;</div>' +
          '</div>' +
          '<div class="vgp-actions">' +
          '<div class="vgp-btn vgp-a" data-code="Space" data-key=" " data-keycode="32">A</div>' +
          '<div class="vgp-btn vgp-b" data-code="ShiftLeft" data-key="Shift" data-keycode="16">B</div>' +
          '</div>' +
          '<div class="vgp-btn vgp-l" data-code="KeyQ" data-key="q" data-keycode="81">L</div>' +
          '<div class="vgp-btn vgp-r" data-code="KeyE" data-key="e" data-keycode="69">R</div>' +
          '<div class="vgp-btn vgp-start" data-code="Escape" data-key="Escape" data-keycode="27">Start</div>';
        document.body.appendChild(root);

        function vgpSendKey(type, code, key, keyCode) {
          var canvas = document.getElementById('unity-canvas');
          var targets = canvas ? [document, window, canvas] : [document, window];
          for (var i = 0; i < targets.length; i++) {
            targets[i].dispatchEvent(new KeyboardEvent(type, {
              code: code, key: key, keyCode: keyCode, which: keyCode,
              bubbles: true, cancelable: true
            }));
          }
        }

        var buttons = root.querySelectorAll('.vgp-btn');
        for (var i = 0; i < buttons.length; i++) {
          (function (btn) {
            var code = btn.getAttribute('data-code');
            var key = btn.getAttribute('data-key');
            var keyCode = parseInt(btn.getAttribute('data-keycode'), 10);
            var activePointer = null;
            btn.addEventListener('pointerdown', function (e) {
              e.preventDefault();
              if (activePointer !== null) return;
              activePointer = e.pointerId;
              btn.classList.add('vgp-active');
              vgpSendKey('keydown', code, key, keyCode);
            });
            function vgpRelease(e) {
              if (activePointer === null || e.pointerId !== activePointer) return;
              activePointer = null;
              btn.classList.remove('vgp-active');
              vgpSendKey('keyup', code, key, keyCode);
            }
            btn.addEventListener('pointerup', vgpRelease);
            btn.addEventListener('pointercancel', vgpRelease);
          })(buttons[i]);
        }

        var vgpHideTimer = null;
        function vgpShow() {
          root.classList.remove('vgp-hidden');
          if (vgpHideTimer) clearTimeout(vgpHideTimer);
          vgpHideTimer = setTimeout(function () { root.classList.add('vgp-hidden'); }, 5000);
        }
        document.addEventListener('touchstart', vgpShow, { passive: true });
        document.addEventListener('pointerdown', vgpShow);
        vgpShow();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', vgpInit);
      } else {
        vgpInit();
      }
    </script>

    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/MarioVsLuigi-WebGL.data.unityweb",
        frameworkUrl: "Build/MarioVsLuigi-WebGL.framework.js.unityweb",
        codeUrl: "Build/MarioVsLuigi-WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ipodtouch0218",
        productName: "NSMB-MarioVsLuigi",
        productVersion: "2.1.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
        hookUnityQuit(unityInstance);
      }).catch((message) => {
        alert(message);
